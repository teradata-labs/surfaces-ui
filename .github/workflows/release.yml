name: Release
# Started by hand from the Actions tab, on main: opens a "Version packages"
# pull request while changesets are pending; running it again after that pull
# request is merged publishes, with provenance, once scripts/check-release.mjs
# passes. Opening the pull request needs the repository setting "Allow GitHub
# Actions to create and approve pull requests" (Settings, Actions, General);
# where the organisation turns it off, the run still pushes the
# changeset-release/main branch, and the pull request is opened from it by hand.
#
# main requires verified signatures, so the version commit and the release
# tags are made through GitHub's API (commitMode: github-api), which signs
# them; a commit made with git here would be unsigned and could not be merged.
#
# npm is reached one of two ways (docs/releasing.md):
# - the NPM_TOKEN secret: a granular token that may write to @surfaces-ui and
#   create-surfaces. Needed for the first release, since a package must exist
#   before it can trust a workflow; delete the secret afterwards.
# - trusted publishing (OIDC): each package on npmjs.com names this repository
#   and release.yml as its trusted publisher, and no secret is kept.
on:
  workflow_dispatch:
concurrency: release-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
