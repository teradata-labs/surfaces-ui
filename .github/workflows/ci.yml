name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Protos are linted and generated code is current
        run: pnpm gen && git diff --exit-code -- packages/proto/src/gen
      - name: UI packages do not depend on the data layer
        run: pnpm check:boundaries
      - name: Agent notes are in place
        run: pnpm check:notes
      - name: Plugins are ready to submit
        run: pnpm check:plugins
      - run: pnpm build
      - name: Generated catalog docs are current
        run: node scripts/generate-docs.mjs && git diff --exit-code -- docs/catalog docs/recipes && test -z "$(git status --porcelain -- docs/catalog docs/recipes)"
      - run: pnpm typecheck
      # Every package's tests run at once here, on a small machine, so a test that takes well under a
      # second on a laptop can pass Vitest's 5-second default; two did, on main, in a row. 30 seconds in CI only.
      - name: Tests
        run: pnpm exec turbo run test -- --testTimeout=30000
      # What the Release workflow will refuse, caught on the pull request instead: the check before and
      # after `changeset version`, so a package that would be versioned apart from the rest fails here.
      # Last in the job, since versioning rewrites package.json files and the changesets in this checkout.
      # With no changesets pending (just after a "Version packages" merge) there is nothing to version, and
      # `changeset version` exits with an error, so the trial runs only when there is a changeset.
      - name: Packages are ready to publish
        run: |
          pnpm check:release
          if find .changeset -name '*.md' ! -name README.md | grep -q .; then
            pnpm changeset version
            node scripts/check-release.mjs
          else
            echo "No changesets pending: nothing to version."
          fi
  # The playground in a real browser (Chromium, desktop and phone sizes), against DuckDB in the page, so no server
  # or credentials are needed: keyboard and pointer use, windowed grids, panel layouts kept across a reload, no
  # sideways scroll on a phone, and every axe check of WCAG 2.2 AA. The report is kept when a test fails.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Chromium and WebKit for Playwright
        run: pnpm --filter @surfaces-ui/e2e exec playwright install --with-deps chromium webkit
      - name: Browser tests
        run: pnpm e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 14
  # A real Next.js app built with `next build` (static export) from the nextjs-site recipe, its HTML read for every
  # page. It is the one test where a server renders Surfaces and a browser takes the HTML over, which is where the
  # theme bugs fixed with @surfaces-ui/next showed: a mismatch on hydration, and a render that never ended.
  nextjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build what the recipe uses
        run: pnpm exec turbo run build --filter=@surfaces-ui/recipes^...
      - name: Next.js site, built and read
        run: pnpm --filter @surfaces-ui/recipes exec vitest run src/nextjs-site
        env:
          SURFACES_TEST_NEXT: "1"
          NEXT_TELEMETRY_DISABLED: "1"
