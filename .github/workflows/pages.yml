name: Pages
# The playground, published: DuckDB in the page and the six sample models only. It is built with
# VITE_SURFACES_PUBLISHED=1, so it never calls the visitor's own machine (no dev server, local model or Loom),
# and served from the repository's path on GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One deploy at a time; a newer push replaces one still waiting, never one already deploying.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The playground reads the built MCP app page and resolves the other packages to their source.
      - run: pnpm build
      - name: Build the playground for Pages
        run: pnpm --filter @surfaces-ui/playground exec vite build --outDir ../../site --emptyOutDir
        env:
          SURFACES_BASE: /${{ github.event.repository.name }}/
          VITE_SURFACES_PUBLISHED: "1"
      # Pages has no rewrites; the playground routes by hash, so one page is enough, and a wrong path shows it too.
      - run: cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
