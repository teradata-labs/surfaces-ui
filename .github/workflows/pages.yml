name: Pages
# The playground, published: DuckDB in the page and the six sample models only. It is built with
# VITE_SURFACES_PUBLISHED=1, so it never calls the visitor's own machine (no dev server, local model or Loom),
# and served from wherever Pages serves it: the custom domain (https://surfaces-ui.com) once that is set on the
# repository, the repository's path until then. Page views are counted by Google Analytics when the repository
# variable GA_MEASUREMENT_ID holds a measurement id (G-…); with none, the site loads nothing from Google.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One deploy at a time; a newer push replaces one still waiting, never one already deploying.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Where Pages serves the site: its base path is empty on a custom domain and the repository's name without one.
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      # The playground reads the built MCP app page and resolves the other packages to their source.
      - run: pnpm build
      - name: Build the playground for Pages
        run: pnpm --filter @surfaces-ui/playground exec vite build --outDir ../../site --emptyOutDir
        env:
          SURFACES_BASE: ${{ steps.pages.outputs.base_path }}/
          # Canonical addresses, link previews and the sitemap name the site where Pages serves it.
          SURFACES_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          VITE_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          VITE_SURFACES_PUBLISHED: "1"
      # The build writes a page for every route (each with its own title, description and text for search engines and
      # link previews), the sitemap, robots.txt and a 404.html that asks not to be indexed. Pages has no rewrites, so a
      # path with no page of its own gets the 404, which still starts the app.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
