name: Component Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build & Bundle Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @teradata-mcp-ui/components build

      - name: Build HTML apps
        run: pnpm --filter @teradata-mcp-ui/components build:apps

      - name: Check bundle sizes
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "| App | Size | Gzipped | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|---------|--------|" >> $GITHUB_STEP_SUMMARY

          MAX_SIZE=512000  # 500KB in bytes
          FAILED=0

          for file in packages/components/dist/apps/*.html; do
            if [ -f "$file" ]; then
              NAME=$(basename "$file")
              SIZE=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null)
              GZIP_SIZE=$(gzip -c "$file" | wc -c | tr -d ' ')

              if [ "$GZIP_SIZE" -gt "$MAX_SIZE" ]; then
                STATUS="FAIL"
                FAILED=1
              else
                STATUS="PASS"
              fi

              SIZE_KB=$((SIZE / 1024))
              GZIP_KB=$((GZIP_SIZE / 1024))
              echo "| $NAME | ${SIZE_KB}KB | ${GZIP_KB}KB | $STATUS |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more bundles exceed 500KB gzipped"
            exit 1
          fi

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm --filter @teradata-mcp-ui/components test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/components/coverage/

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm --filter @teradata-mcp-ui/components exec tsc --noEmit

      - name: Lint
        run: pnpm --filter @teradata-mcp-ui/components lint

  accessibility:
    name: Accessibility Check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run accessibility tests
        run: pnpm --filter @teradata-mcp-ui/components exec vitest run --reporter=verbose "**/*.a11y.test.*"
