name: Component Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Bundle Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high || echo "::warning::pnpm audit failed (may be transient npm registry issue)"
        continue-on-error: true

      - name: Build library
        run: pnpm --filter @surfacesui/components build

      - name: Build HTML apps
        run: pnpm --filter @surfacesui/components build:apps

      - name: Check bundle sizes
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "| App | Size | Gzipped | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|---------|--------|" >> $GITHUB_STEP_SUMMARY

          MAX_SIZE=665600  # 650KB in bytes (json-render includes ECharts)
          FAILED=0

          for file in packages/components/dist/apps/*.html; do
            if [ -f "$file" ]; then
              NAME=$(basename "$file")
              SIZE=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null)
              GZIP_SIZE=$(gzip -c "$file" | wc -c | tr -d ' ')

              if [ "$GZIP_SIZE" -gt "$MAX_SIZE" ]; then
                STATUS="FAIL"
                FAILED=1
              else
                STATUS="PASS"
              fi

              SIZE_KB=$((SIZE / 1024))
              GZIP_KB=$((GZIP_SIZE / 1024))
              echo "| $NAME | ${SIZE_KB}KB | ${GZIP_KB}KB | $STATUS |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more bundles exceed 500KB gzipped"
            exit 1
          fi

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm --filter @surfacesui/components test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: packages/components/coverage/

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm --filter @surfacesui/components exec tsc --noEmit

      - name: Lint
        run: pnpm --filter @surfacesui/components lint

  accessibility:
    name: Accessibility Check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run accessibility tests
        run: pnpm --filter @surfacesui/components exec vitest run --reporter=verbose a11y.test
