name: Component Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Bundle Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high || echo "::warning::pnpm audit failed (may be transient npm registry issue)"
        continue-on-error: true

      - name: Build component library
        run: pnpm --filter @surfacesui/components build

      - name: Build HTML apps
        run: pnpm --filter @surfacesui/components build:apps

      - name: Check bundle sizes
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "| App | Size | Gzipped | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|---------|--------|" >> $GITHUB_STEP_SUMMARY

          MAX_SIZE=716800  # 700KB in bytes (React 19 + ECharts in sql-editor)
          FAILED=0

          for file in packages/components/dist/apps/*.html; do
            if [ -f "$file" ]; then
              NAME=$(basename "$file")
              SIZE=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null)
              GZIP_SIZE=$(gzip -c "$file" | wc -c | tr -d ' ')

              if [ "$GZIP_SIZE" -gt "$MAX_SIZE" ]; then
                STATUS="FAIL"
                FAILED=1
              else
                STATUS="PASS"
              fi

              SIZE_KB=$((SIZE / 1024))
              GZIP_KB=$((GZIP_SIZE / 1024))
              echo "| $NAME | ${SIZE_KB}KB | ${GZIP_KB}KB | $STATUS |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more bundles exceed 700KB gzipped"
            exit 1
          fi

      - name: Build mcp-adapter
        run: pnpm --filter @surfacesui/mcp-adapter build

      - name: Verify adapter bundles
        run: |
          echo "## MCP Adapter Bundles" >> $GITHUB_STEP_SUMMARY
          ls -la packages/mcp-adapter/apps/*.html
          count=$(ls packages/mcp-adapter/apps/*.html 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::No HTML bundles found in mcp-adapter/apps/"
            exit 1
          fi
          echo "Found $count HTML bundle(s) in mcp-adapter/apps/" >> $GITHUB_STEP_SUMMARY

      - name: Build server
        run: pnpm --filter @surfacesui/server build

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build packages for testing
        run: |
          pnpm --filter @surfacesui/components build
          pnpm --filter @surfacesui/app-framework build
          pnpm --filter @surfacesui/mcp-adapter build

      - name: Run component tests with coverage
        run: pnpm --filter @surfacesui/components test:coverage

      - name: Run mcp-adapter tests
        run: pnpm --filter @surfacesui/mcp-adapter test

      - name: Run server tests
        run: pnpm --filter @surfacesui/server test

      - name: Run app-framework tests
        run: pnpm --filter @surfacesui/app-framework test

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: packages/components/coverage/

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: TypeScript type check (components)
        run: pnpm --filter @surfacesui/components exec tsc --noEmit

      - name: TypeScript type check (mcp-adapter)
        run: pnpm --filter @surfacesui/mcp-adapter exec tsc --noEmit

      - name: Build mcp-adapter types (required for server type check)
        run: pnpm --filter @surfacesui/mcp-adapter exec tsc

      - name: TypeScript type check (server)
        run: pnpm --filter @surfacesui/server exec tsc --noEmit

      - name: Lint
        run: pnpm --filter @surfacesui/components lint

  accessibility:
    name: Accessibility Check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run accessibility tests
        run: pnpm --filter @surfacesui/components exec vitest run --reporter=verbose a11y.test
